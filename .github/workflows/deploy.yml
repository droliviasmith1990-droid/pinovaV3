name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build on GitHub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          # Sentry Auth Token needed for source map upload during build
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Compress Build Artifacts
        run: |
          tar -czf app.tar.gz .next public src package.json package-lock.json next.config.ts ecosystem.config.js tsconfig.json

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: app.tar.gz
          retention-days: 1

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build

      - name: Transfer Build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "app.tar.gz"
          target: "/tmp/"

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            echo "🚀 Starting Deployment..."
            cd /root/pinterest-editor

            echo "📦 Extracting files..."
            # Clean old .next to ensure no conflicts, though tar overwrite handles most
            rm -rf .next

            # Extract new files
            tar -xzf /tmp/app.tar.gz -C .
            rm /tmp/app.tar.gz

            echo "📦 Installing Production Dependencies..."
            # Use --omit=dev for speed, we don't need devDeps on VPS anymore
            npm install --omit=dev

            echo "🔄 Reloading PM2..."
            pm2 reload ecosystem.config.js

            echo "✅ Deployment Complete!"
